services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wifi
      POSTGRES_PASSWORD: wifi
      POSTGRES_DB: wifi
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wifi -d wifi"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: wifi
      RABBITMQ_DEFAULT_PASS: wifi
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      PORT: 3000
      TZ: America/Sao_Paulo
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: wifi
      DATABASE_PASSWORD: wifi
      DATABASE_NAME: wifi
      DB_SYNC: "true"
      SEED_STORES: "true"
      SEED_CONNECTIONS: "true"
      SEED_CONNECTIONS_COUNT: 6000
      RABBITMQ_URL: amqp://wifi:wifi@rabbitmq:5672
      FRONTEND_URL: http://localhost:8080,http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres-data:
